ra que estudian administraci\xF3n y sea $Y_2$ el n\xFAmero de estudiantes en la muestra que estudian m\xFAsica.",items:[{k:"a",g:2,q:"Encuentre la funci\xF3n de distribuci\xF3n conjunta de $Y_1$ y $Y_2$.",sol:[["Modelo","Hay 2 de administraci\xF3n, 2 de m\xFAsica y 3 de econom\xEDa. Sin reemplazo: $$p(y_1,y_2)=\\frac{\\binom{2}{y_1}\\binom{2}{y_2}\\binom{3}{3-y_1-y_2}}{\\binom{7}{3}},\\qquad \\binom73=35,$$ con $y_1,y_2\\in\\{0,1,2\\}$ y $y_1+y_2\\le 3$."],["Tabla (en 35avos)","$$\\begin{array}{c|ccc|c} y_2\\backslash y_1 & 0 & 1 & 2 & p_2(y_2)\\\\ \\hline 0 & 1 & 6 & 3 & 10\\\\ 1 & 6 & 12 & 2 & 20\\\\ 2 & 3 & 2 & 0 & 5\\\\ \\hline p_1(y_1) & 10 & 20 & 5 & 35\\end{array}$$ Por ejemplo, $p(1,1)=\\binom21\\binom21\\binom31/35=12/35$ y $p(2,2)=0$ porque no caben 4 personas en una muestra de 3."]]},{k:"b",g:2,q:"\xBF Son las variables $Y_1$ y $Y_2$ independientes? Justifique.",sol:[["Contraejemplo","$p(2,2)=0$, pero $p_1(2)\\,p_2(2)=\\frac{5}{35}\\cdot\\frac{5}{35}=\\frac{25}{1225}\\neq0$. Como la factorizaci\xF3n falla en un par, <b>no</b> son independientes."]]},{k:"c",g:2,q:"Calcular $E\\left(2Y_1-3Y_2-4\\right)$ y $V\\left(2Y_1-3Y_2-4\\right)$.",checks:[{l:"E(2Y\u2081\u22123Y\u2082\u22124)",v:-4.857142857142857,tol:.005},{l:"V(2Y\u2081\u22123Y\u2082\u22124)",v:7.26530612244898,tol:.006}],sol:[["Medias","$$E(Y_1)=E(Y_2)=\\frac{0(10)+1(20)+2(5)}{35}=\\frac{30}{35}=\\frac67$$"],["Esperanza","$$E(2Y_1-3Y_2-4)=2\\cdot\\tfrac67-3\\cdot\\tfrac67-4=-\\tfrac67-4=-\\tfrac{34}{7}\\approx-4.857$$"],["Varianzas","$$E(Y_i^2)=\\frac{20+4(5)}{35}=\\frac87\\ \\Rightarrow\\ V(Y_1)=V(Y_2)=\\frac87-\\frac{36}{49}=\\frac{20}{49}$$"],["Covarianza","$$E(Y_1Y_2)=\\frac{1\\cdot1(12)+2\\cdot1(2)+1\\cdot2(2)}{35}=\\frac{20}{35}=\\frac47,\\qquad \\mathrm{Cov}=\\frac{28}{49}-\\frac{36}{49}=-\\frac{8}{49}$$"],["Varianza","$$V(2Y_1-3Y_2-4)=4\\cdot\\tfrac{20}{49}+9\\cdot\\tfrac{20}{49}+2(2)(-3)\\left(-\\tfrac{8}{49}\\right)=\\tfrac{80+180+96}{49}=\\tfrac{356}{49}\\approx7.265$$"]]}]},{n:2,statement:"La funci\xF3n de densidad conjunta para $Y_1$ y $Y_2$ est\xE1 dada por: $$f(y_1,y_2)=\\begin{cases}k(1-y_2), & si\\quad 0\\le y_1\\le y_2\\le 1,\\\\ 0 & en\\quad c.o.p.\\end{cases}$$",items:[{k:"a",g:2,q:"Encuentre el valor de $k$.",checks:[{l:"k",v:6,tol:.001}],sol:[["Integrar a 1","$$\\int_0^1\\!\\!\\int_0^{y_2}k(1-y_2)\\,dy_1\\,dy_2=k\\int_0^1 y_2(1-y_2)\\,dy_2=k\\left(\\tfrac12-\\tfrac13\\right)=\\frac k6=1\\ \\Rightarrow\\ k=6$$"]]},{k:"b",g:2,q:"Encuentre las funciones de densidad marginal para $Y_1$ y $Y_2$.",sol:[["Marginal de $Y_1$","$$f_1(y_1)=\\int_{y_1}^{1}6(1-y_2)\\,dy_2=3(1-y_1)^2,\\qquad 0\\le y_1\\le1$$"],["Marginal de $Y_2$","$$f_2(y_2)=\\int_0^{y_2}6(1-y_2)\\,dy_1=6y_2(1-y_2),\\qquad 0\\le y_2\\le1$$"]]},{k:"c",g:2,q:"Calcular $P\\left(Y_2\\le 1/2\\mid Y_1\\le 3/4\\right)$",checks:[{l:"Probabilidad",v:.5079365079365079,tol:.002}],sol:[["Numerador","Como $Y_1\\le Y_2$, el evento $Y_2\\le\\frac12$ ya implica $Y_1\\le\\frac12\\le\\frac34$. $$P(Y_2\\le\\tfrac12,\\,Y_1\\le\\tfrac34)=P(Y_2\\le\\tfrac12)=\\int_0^{1/2}6y(1-y)\\,dy=\\left[3y^2-2y^3\\right]_0^{1/2}=\\tfrac12$$"],["Denominador","$$P(Y_1\\le\\tfrac34)=\\int_0^{3/4}3(1-y)^2\\,dy=1-\\left(\\tfrac14\\right)^3=\\tfrac{63}{64}$$"],["Resultado","$$P(Y_2\\le\\tfrac12\\mid Y_1\\le\\tfrac34)=\\frac{1/2}{63/64}=\\frac{32}{63}\\approx0.508$$"]]},{k:"d",g:2,q:"Calcular $P\\left(Y_2\\ge 3/4\\mid Y_1=1/2\\right)$",checks:[{l:"Probabilidad",v:.25,tol:.001}],sol:[["Condicional","$$f(y_2\\mid y_1)=\\frac{6(1-y_2)}{3(1-y_1)^2},\\quad y_1\\le y_2\\le1\\qquad\\Rightarrow\\qquad f(y_2\\mid \\tfrac12)=8(1-y_2),\\quad \\tfrac12\\le y_2\\le1$$"],["Integral","$$P(Y_2\\ge\\tfrac34\\mid Y_1=\\tfrac12)=\\int_{3/4}^1 8(1-y_2)\\,dy_2=8\\cdot\\frac{(1/4)^2}{2}=\\frac14$$"]]}]},{n:3,statement:"Para dos poblaciones normales $N(\\mu_A,\\sigma_A^2)$, $N(\\mu_B,\\sigma_B^2)$. De muestras independientes correspondientes se tienen estad\xEDsticos respectivos $\\bar y_A$, $s_A^2$ y $\\bar y_B$, $s_B^2$. Suponga lo siguiente: $s_A^2/s_B^2=3$ y $\\dfrac{\\bar y_A-\\bar y_B}{s_p\\sqrt{(1/n_A)+(1/n_B)}}=1$. Use $\\alpha=0.05$ para las pruebas y un una nivel de confianza del 95% para los intervalos.",items:[{k:"a",g:5,q:"Si va a probar $H_0:\\sigma_A^2=\\sigma_B^2$ versus $H_0:\\sigma_A^2\\neq\\sigma_B^2$, $n_A=10$, $n_B=12$ escriba el valor del estad\xEDstico de prueba y diga si rechaza o no la hip\xF3tesis nula. Justifique claramente.",checks:[{l:"Estad\xEDstico F",v:3,tol:.001}],sol:[["Estad\xEDstico","$$F=\\frac{s_A^2}{s_B^2}=3,\\qquad gl=(n_A-1,\\,n_B-1)=(9,\\,11)$$"],["Regi\xF3n de rechazo (bilateral)","$$F>F_{0.025;\\,9,11}\\approx3.59\\quad\\text{o}\\quad F<F_{0.975;\\,9,11}=\\frac{1}{F_{0.025;\\,11,9}}\\approx\\frac{1}{3.91}=0.256$$"],["Decisi\xF3n","$0.256<3<3.59$: el estad\xEDstico no cae en la RR, as\xED que <b>no se rechaza</b> $H_0$. Es razonable suponer $\\sigma_A^2=\\sigma_B^2$, lo que justifica usar $s_p$ en los literales c y d."]]},{k:"b",g:4,q:"Construya un intervalo de confianza de 95% par $\\frac{\\sigma_A^2}{\\sigma_B^2}$ si $n_A=10$, $n_B=12$, interprete el resultado.",checks:[{l:"L\xEDmite inferior",v:.8361,tol:.006},{l:"L\xEDmite superior",v:11.736,tol:.03}],sol:[["F\xF3rmula","$$\\left(\\frac{s_A^2}{s_B^2}\\,\\frac{1}{F_{0.025;\\,9,11}},\\ \\frac{s_A^2}{s_B^2}\\,F_{0.025;\\,11,9}\\right)$$"],["C\xE1lculo","$$\\left(\\frac{3}{3.588},\\ 3(3.912)\\right)=(0.836,\\ 11.74)$$"],["Interpretaci\xF3n","Con 95% de confianza el cociente $\\sigma_A^2/\\sigma_B^2$ est\xE1 entre 0.836 y 11.74. El intervalo contiene el 1, coherente con no rechazar la igualdad de varianzas en (a)."]]},{k:"c",g:5,q:"Si va a probar $H_0:\\mu_A=\\mu_B$ versus $H_0:\\mu_A\\neq\\mu_B$, $n_A=10$, $n_B=12$, escriba el valor del estad\xEDstico de prueba y diga si rechaza o no la hip\xF3tesis nula. Justifique claramente.",checks:[{l:"Estad\xEDstico t",v:1,tol:.001}],sol:[["Estad\xEDstico","Poblaciones normales con varianzas iguales (por a): $$t=\\frac{\\bar y_A-\\bar y_B}{s_p\\sqrt{1/n_A+1/n_B}}=1,\\qquad gl=n_A+n_B-2=20$$"],["Decisi\xF3n","$t_{0.025,20}=2.086$. Como $|t|=1<2.086$, <b>no se rechaza</b> $H_0$ (valor-p $\\approx0.33$): no hay evidencia de que las medias difieran."]]},{k:"d",g:4,q:"Construya un intervalo del 95% de confianza para $\\mu_A-\\mu_B$ si $s_p=1.95$ y $n_A=10$, $n_B=12$,interprete el resultado.",checks:[{l:"L\xEDmite inferior",v:-.9067,tol:.01},{l:"L\xEDmite superior",v:2.5766,tol:.01}],sol:[["Diferencia observada","Del dato del enunciado: $$\\bar y_A-\\bar y_B=1\\cdot s_p\\sqrt{\\tfrac1{10}+\\tfrac1{12}}=1.95(0.4282)=0.835$$"],["Intervalo","$$0.835\\pm t_{0.025,20}\\,s_p\\sqrt{\\tfrac1{10}+\\tfrac1{12}}=0.835\\pm2.086(0.835)=0.835\\pm1.742=[-0.907,\\ 2.577]$$"],["Interpretaci\xF3n","Con 95% de confianza $\\mu_A-\\mu_B$ est\xE1 entre $-0.907$ y $2.577$. Contiene el 0, coherente con no rechazar $H_0$ en (c)."]]}]},{n:4,statement:"Considere el modelo $Y=\\gamma x+\\epsilon$ donde $\\epsilon\\sim N(0,\\sigma^2)$. Se tiene una muestra $\\{(x_i,y_i)\\mid i=1,\\dots,n\\}$, entonces la funci\xF3n de densidad de $Y_i$ es: $$f_{Y_i}(y_i)=\\frac{1}{\\sqrt{2\\pi\\sigma^2}}e^{-\\frac{(y_i-\\gamma x_i)^2}{2\\sigma^2}}.$$",items:[{k:"a",g:3,q:"Hallar los estimadores de m\xE1xima verosimilitud de $\\gamma$ y $\\sigma^2$.",sol:[["Log-verosimilitud","$$\\ell(\\gamma,\\sigma^2)=-\\frac n2\\ln(2\\pi)-\\frac n2\\ln\\sigma^2-\\frac{1}{2\\sigma^2}\\sum_{i=1}^n(y_i-\\gamma x_i)^2$$"],["Para $\\gamma$","$$\\frac{\\partial\\ell}{\\partial\\gamma}=\\frac{1}{\\sigma^2}\\sum x_i(y_i-\\gamma x_i)=0\\ \\Rightarrow\\ \\hat\\gamma=\\frac{\\sum x_iY_i}{\\sum x_i^2}$$"],["Para $\\sigma^2$","$$\\frac{\\partial\\ell}{\\partial\\sigma^2}=-\\frac{n}{2\\sigma^2}+\\frac{1}{2\\sigma^4}\\sum(y_i-\\gamma x_i)^2=0\\ \\Rightarrow\\ \\hat\\sigma^2=\\frac1n\\sum_{i=1}^n(Y_i-\\hat\\gamma x_i)^2$$"]]},{k:"b",g:3,q:"Muestre que el estimador de m\xE1xima verosimilitud de $\\gamma$ es insesgado.",sol:[["Esperanza","Los $x_i$ son constantes y $E(Y_i)=\\gamma x_i$ porque $E(\\epsilon)=0$: $$E(\\hat\\gamma)=\\frac{\\sum x_iE(Y_i)}{\\sum x_i^2}=\\frac{\\sum x_i(\\gamma x_i)}{\\sum x_i^2}=\\gamma$$ Por tanto $\\hat\\gamma$ es insesgado."]]}]}]},{key:"2017",year:2017,en:"Final Examination, 2017",es:"Examen final 2017",notes:["El punto 5 se omiti\xF3 por decisi\xF3n tuya: con los datos tal como est\xE1n escritos, $\\sum x_i^2=36950<n\\bar x^2$, lo cual es imposible.","El punto 6(b) aparece cortado en la imagen despu\xE9s de \u201CEl estad\xEDstico de prueba es $t=$\u201D. No se complet\xF3.","En el punto 4, la densidad escrita $\\frac{2}{\\theta^3}ye^{-y/\\theta}$ no integra a 1; los momentos dados ($E(Y)=3\\theta$, $V(Y)=3\\theta^2$) corresponden a $\\frac{1}{2\\theta^3}y^2e^{-y/\\theta}$. El estimador de MV es el mismo con cualquiera de las dos.","El enunciado no indica la duraci\xF3n del examen: t\xFA eliges la duraci\xF3n del cron\xF3metro."],problems:[{n:1,statement:"Sup\xF3ngase que la probabilidad de obtener una unidad defectuosa en una l\xEDnea de ensamble es es de 0.05. Si el n\xFAmero de unidades terminadas constituye un conjunto de ensayos independientes",items:[{k:"a",g:1,q:"\xBF Cu\xE1l es la probabilidad que entre 20 unidades m\xE1ximo dos se encuentren defectuosas?",checks:[{l:"Probabilidad",v:.924516,tol:8e-4}],sol:[["Binomial","$Y\\sim\\text{Bin}(20,\\,0.05)$: $$P(Y\\le2)=\\sum_{y=0}^{2}\\binom{20}{y}(0.05)^y(0.95)^{20-y}=0.3585+0.3774+0.1887=0.9245$$"]]},{k:"b.i",g:1,q:"Si en la bodega de almacenamiento se reviasn una por una. i. \xBFCu\xE1l es la probabilidad de que la septima unidad probada sea la primera defectuosa?",checks:[{l:"Probabilidad",v:.036755,tol:2e-4}],sol:[["Geom\xE9trica","Seis buenas y luego una defectuosa: $$P(Y=7)=(0.95)^6(0.05)=0.0368$$"]]},{k:"b.ii",g:1,q:"ii. \xBFCu\xE1l es la probabilidad de que la octava unidad revisada sea la tercera en mal estado?",checks:[{l:"Probabilidad",v:.0020312,tol:2e-5}],sol:[["Binomial negativa","Dos defectuosas entre las primeras 7 y la octava defectuosa: $$P(Y=8)=\\binom{7}{2}(0.05)^3(0.95)^5=21(0.000125)(0.7738)=0.00203$$"]]},{k:"c",g:1,q:"Sil los defectos se pueden clasificar como remediables y no remediables y en una selecci\xF3n previa se tienen 80 unidades defectuosas de las cuales 20 poseen defectos no remediables, encuentre la probabilidad que al seleccionar 5, m\xE1ximo una tenga un defecto no remediable.",checks:[{l:"Probabilidad",v:.63287,tol:8e-4}],sol:[["Hipergeom\xE9trica","$N=80$, $r=20$ no remediables, $n=5$: $$P(X\\le1)=\\frac{\\binom{60}{5}+\\binom{20}{1}\\binom{60}{4}}{\\binom{80}{5}}=\\frac{5\\,461\\,512+9\\,752\\,700}{24\\,040\\,016}=0.6329$$"]]}]},{n:2,statement:"Se lanzan dos dados. Se tienen las dos variables aleatorias $Y_1$ y $Y_2$ definidas de la siguiente forma: $Y_1=0$ si la suma es par, $Y_1=1$ si la suma es impar; $Y_2=-1$ si el mayor de los dos n\xFAmeros es par, $Y_2=0$ si el mayor de los dos n\xFAmeros es impar, $Y_2=1$ si los dos n\xFAmeros son iguales.",note:"En la soluci\xF3n, cuando los dos n\xFAmeros son iguales se toma $Y_2=1$ (prevalece sobre la regla del mayor).",items:[{k:"a",g:2,q:"En una tabla represente la funci\xF3n de probabilidad conjunta de $(Y_1,Y_2)$.",sol:[["Conteo","De los 36 resultados, 6 son dobles (suma par, $Y_2=1$). Para los 30 restantes, con mayor $m$ hay $2(m-1)$ pares ordenados; la suma es par si el otro n\xFAmero tiene la misma paridad que $m$."],["Tabla (en 36avos)","$$\\begin{array}{c|cc|c} Y_2\\backslash Y_1 & 0 & 1 & p_2\\\\ \\hline -1 & 6 & 12 & 18\\\\ 0 & 6 & 6 & 12\\\\ 1 & 6 & 0 & 6\\\\ \\hline p_1 & 18 & 18 & 36\\end{array}$$"]]},{k:"b",g:2,q:"Halle las funciones de probabilidad marginal de $Y_1$ y $Y_2$.",sol:[["Marginales","$p_1(0)=p_1(1)=\\frac12$;  $p_2(-1)=\\frac{18}{36}=\\frac12$, $p_2(0)=\\frac{12}{36}=\\frac13$, $p_2(1)=\\frac{6}{36}=\\frac16$."]]},{k:"c",g:2,q:"Halle $\\mathrm{cov}(Y_1,Y_2)$",checks:[{l:"cov(Y\u2081,Y\u2082)",v:-.16666666666666666,tol:.002}],sol:[["Covarianza","$$E(Y_1)=\\tfrac12,\\quad E(Y_2)=\\tfrac{-18+6}{36}=-\\tfrac13,\\quad E(Y_1Y_2)=\\tfrac{(1)(-1)(12)}{36}=-\\tfrac13$$ $$\\mathrm{cov}(Y_1,Y_2)=-\\tfrac13-\\tfrac12\\left(-\\tfrac13\\right)=-\\tfrac16$$"]]}]},{n:3,statement:"Considere la funci\xF3n de densidad conjunta de $(X,Y)$ dada por $$f(x,y)=\\begin{cases}6y, & x\\ge0,\\ y\\ge0,\\ x+y\\le1\\\\ 0, & \\text{en cualquier otro punto.}\\end{cases}$$",items:[{k:"a",g:2,q:"Hallr $P\\left(Y<X\\right)$",checks:[{l:"Probabilidad",v:.25,tol:.001}],sol:[["Regi\xF3n","$y<x$ y $x+y\\le1$: $0\\le y\\le\\frac12$, $y<x\\le1-y$. $$P(Y<X)=\\int_0^{1/2}6y(1-2y)\\,dy=6\\left(\\tfrac18-\\tfrac1{12}\\right)=\\tfrac14$$"]]},{k:"b",g:2,q:"Hallar $f_X(x)$, $f_Y(y)$.",sol:[["Marginales","$$f_X(x)=\\int_0^{1-x}6y\\,dy=3(1-x)^2,\\ \\ 0\\le x\\le1;\\qquad f_Y(y)=\\int_0^{1-y}6y\\,dx=6y(1-y),\\ \\ 0\\le y\\le1$$"]]},{k:"c",g:2,q:"Hallar $f\\left(X/Y=y\\right)$",sol:[["Condicional","$$f(x\\mid y)=\\frac{6y}{6y(1-y)}=\\frac{1}{1-y},\\qquad 0\\le x\\le1-y$$ Es decir, $X\\mid Y=y$ es uniforme en $[0,\\,1-y]$."]]},{k:"d",g:2,q:"Hallar $P\\left(X\\le 1/4\\mid Y=1/2\\right)$",checks:[{l:"Probabilidad",v:.5,tol:.001}],sol:[["Uniforme","Con $y=\\frac12$, $X$ es uniforme en $[0,\\frac12]$: $$P(X\\le\\tfrac14\\mid Y=\\tfrac12)=\\frac{1/4}{1/2}=\\frac12$$"]]}]},{n:4,statement:"Cierto tipo de componente electr\xF3nico tiene una duraci\xF3n $Y$ (en horas) con funci\xF3n de densidad de probabilidad dada por $f(y\\mid\\theta)=\\frac{2}{\\theta^3}ye^{-\\frac{y}{\\theta}}I_{[0,\\infty]}(y)$, se tiene $E(Y)=3\\theta$, $V(Y)=3\\theta^2$.",items:[{k:"a",g:3,q:"Encuentre un estimador de $\\theta$ por el m\xE9todo de los momentos.",sol:[["Igualar momentos","$$E(Y)=3\\theta=\\bar Y\\ \\Rightarrow\\ \\tilde\\theta=\\frac{\\bar Y}{3}$$"]]},{k:"b",g:3,q:"Encuentre el estimador de m\xE1xima verosimilitud $\\hat\\theta$ de $\\theta$.",sol:[["Log-verosimilitud","Con la densidad como est\xE1 escrita (o con $\\frac{1}{2\\theta^3}y^2e^{-y/\\theta}$, que es la coherente con los momentos dados), la parte que depende de $\\theta$ es la misma: $$\\ell(\\theta)=\\text{cte}-3n\\ln\\theta-\\frac1\\theta\\sum y_i$$"],["Optimizar","$$\\ell'(\\theta)=-\\frac{3n}{\\theta}+\\frac{\\sum y_i}{\\theta^2}=0\\ \\Rightarrow\\ \\hat\\theta=\\frac{\\bar Y}{3},\\qquad \\ell''(\\hat\\theta)=\\frac{3n}{\\hat\\theta^2}-\\frac{6n}{\\hat\\theta^2}<0$$"]]},{k:"c",g:3,q:"Muestre que $\\hat\\theta$ es insesgado y consistente.",sol:[["Insesgado","$E(\\hat\\theta)=\\frac{E(\\bar Y)}{3}=\\frac{3\\theta}{3}=\\theta$."],["Consistente","$V(\\hat\\theta)=\\frac{V(Y)}{9n}=\\frac{3\\theta^2}{9n}=\\frac{\\theta^2}{3n}\\to0$. Insesgado con varianza que tiende a 0, luego consistente."]]},{k:"d",g:3,q:"Muestre que $\\hat\\theta$ es eficiente.",sol:[["Informaci\xF3n de Fisher","$$\\frac{\\partial}{\\partial\\theta}\\ln f=-\\frac3\\theta+\\frac{y}{\\theta^2}=\\frac{y-3\\theta}{\\theta^2},\\qquad I(\\theta)=\\frac{V(Y)}{\\theta^4}=\\frac{3}{\\theta^2}$$"],["Cota","$$\\frac{1}{nI(\\theta)}=\\frac{\\theta^2}{3n}=V(\\hat\\theta)$$ Alcanza la cota de Cram\xE9r-Rao: $\\hat\\theta$ es eficiente."]]}]},{n:6,statement:"Diga si es falso o verdadero y justifique",items:[{k:"a",g:3,type:"tf",ans:!1,q:"Se tienen $n$ observaciones $x_1,x_2,\\dots,x_n$ independientes, de una variable aleatoria uniforme en el intervalo $(b,b+1)$. $\\hat b=2\\bar x$ es un estimador por el m\xE9todo de los momentos de $b$.",sol:[["Falso","$E(X)=\\frac{b+(b+1)}{2}=b+\\frac12$. Igualando con $\\bar x$: $$\\hat b=\\bar x-\\frac12\\neq 2\\bar x$$ (Por ejemplo, si $b=0$, $2\\bar x\\approx1$ en lugar de 0.)"]]},{k:"b",g:5,type:"missing",q:"Se tiene una muestra de 5 observaciones de una poblaci\xF3n normal con la media y la varianza desconocidas. Se quiere probar $H_0:\\mu=\\mu_0$ contra la alternativa $H_a:\\mu>\\mu_0$. El estad\xEDstico de prueba es $t=$ \u2026",sol:[]}]}]}],$i=Object.fromEntries(_n.map(e=>[e.key,e])),_r=_n.flatMap(e=>e.problems.flatMap(t=>t.items.filter(n=>n.type!=="missing").map(n=>({...n,id:`${e.key}-${t.n}${n.k}`,exam:e.key,pn:t.n,statement:t.statement,pnote:t.note}))));var Ko="data:image/webp;ba
